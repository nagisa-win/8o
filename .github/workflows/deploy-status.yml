name: Deploy 状态巡检

on:
  push:
    branches: [main]
    paths: ["workers/status/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-status
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/check.mjs
      - run: npm run build
      - run: npx wrangler deploy --config wrangler.status.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
