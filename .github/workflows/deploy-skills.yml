name: Deploy 技能包站点

on:
  push:
    branches: [main]
    paths:
      - "sites/skills/**"
      - "packages/tokens/**"
      - "scripts/**"
      - ".github/workflows/deploy-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-skills
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/check.mjs
      - run: npm run build
      - run: npx wrangler deploy --config wrangler.skills.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
