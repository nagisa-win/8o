<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ 星河幻境</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050508;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    font-family: 'Arial', sans-serif;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
  }

  /* 标题覆盖层 */
  .overlay-text {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    mix-blend-mode: color-dodge;
  }
  .overlay-text h1 {
    font-size: clamp(2rem, 8vw, 6rem);
    font-weight: 100;
    color: #fff;
    letter-spacing: 0.4em;
    text-shadow:
      0 0 40px rgba(200, 150, 255, 0.6),
      0 0 80px rgba(100, 200, 255, 0.3),
      0 0 120px rgba(200, 100, 255, 0.2);
    animation: fadePulse 4s ease-in-out infinite alternate;
  }
  .overlay-text p {
    font-size: clamp(0.5rem, 1.2vw, 1rem);
    color: rgba(200, 180, 255, 0.3);
    letter-spacing: 0.8em;
    margin-top: 1rem;
    font-weight: 100;
  }
  @keyframes fadePulse {
    0% { opacity: 0.6; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.03); }
  }

  /* 角落装饰 */
  .corner-deco {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    opacity: 0.2;
  }
  .cd-tl {
    top: 30px; left: 30px;
    width: 80px; height: 80px;
    border-top: 1px solid rgba(200,150,255,0.5);
    border-left: 1px solid rgba(200,150,255,0.5);
  }
  .cd-br {
    bottom: 30px; right: 30px;
    width: 80px; height: 80px;
    border-bottom: 1px solid rgba(200,150,255,0.5);
    border-right: 1px solid rgba(200,150,255,0.5);
  }

  /* FPS */
  #fps {
    position: fixed;
    bottom: 16px; left: 16px;
    z-index: 100;
    font-family: monospace;
    font-size: 0.6rem;
    color: rgba(200,180,255,0.12);
    pointer-events: none;
  }
</style>
  <link rel="icon" href="/assets/favicon.svg">
</head>
<body>

<canvas id="galaxyCanvas"></canvas>

<div class="corner-deco cd-tl"></div>
<div class="corner-deco cd-br"></div>

<div class="overlay-text">
  <h1>GALAXY</h1>
  <p>✦ 每个粒子都是一颗星辰 ✦</p>
</div>

<div id="fps">-- FPS</div>

<script>
// ============================================================
// 3D 粒子星系 —— 纯 Canvas 实现
// ============================================================
const canvas = document.getElementById('galaxyCanvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---- 鼠标 ----
const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
document.addEventListener('mousemove', e => {
  mouse.targetX = (e.clientX / W - 0.5) * 2;
  mouse.targetY = (e.clientY / H - 0.5) * 2;
});
document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouse.targetX = (t.clientX / W - 0.5) * 2;
  mouse.targetY = (t.clientY / H - 0.5) * 2;
}, { passive: true });

// ---- 3D 粒子 ----
const PARTICLE_COUNT = 4000;
const particles = [];

function randomInSphere(radius) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = radius * Math.cbrt(Math.random());
  return {
    x: r * Math.sin(phi) * Math.cos(theta),
    y: r * Math.sin(phi) * Math.sin(theta),
    z: r * Math.cos(phi)
  };
}

// 创建两个旋臂效果
for (let i = 0; i < PARTICLE_COUNT; i++) {
  const arm = Math.random() > 0.5 ? 1 : -1;
  const dist = Math.pow(Math.random(), 0.6) * 500;
  const angle = i * 0.02 + arm * dist * 0.006;
  const spread = (1 - dist / 500) * 60 + 10;
  const t = Math.random() * Math.PI * 2;

  let x, y, z;
  if (i < PARTICLE_COUNT * 0.7) {
    // 旋涡星系
    x = Math.cos(angle) * dist + (Math.random() - 0.5) * spread;
    z = Math.sin(angle) * dist + (Math.random() - 0.5) * spread;
    y = (Math.random() - 0.5) * spread * 0.3;
  } else {
    // 外围晕
    const sphere = randomInSphere(600);
    x = sphere.x;
    y = sphere.y;
    z = sphere.z;
  }

  const hue = 200 + (dist / 500) * 100 + Math.random() * 40;
  const size = Math.random() * 2 + 0.5;

  particles.push({ x, y, z, origX: x, origY: y, origZ: z, hue, size, alpha: Math.random() * 0.5 + 0.3 });
}

// ---- 旋转 & 投影 ----
let rotX = 0, rotY = 0;
const focalLength = 800;

function rotateX(p, angle) {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const y = p.y * cos - p.z * sin;
  const z = p.y * sin + p.z * cos;
  p.y = y; p.z = z;
}
function rotateY(p, angle) {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const x = p.x * cos + p.z * sin;
  const z = -p.x * sin + p.z * cos;
  p.x = x; p.z = z;
}
function rotateZ(p, angle) {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const x = p.x * cos - p.y * sin;
  const y = p.x * sin + p.y * cos;
  p.x = x; p.y = y;
}

// ---- 绘制星星（闪烁背景） ----
function drawBgStars() {
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 80; i++) {
    const sx = (i * 173.5 + 31) % W;
    const sy = (i * 237.8 + 67) % H;
    const sr = ((i * 53 + 17) % 3) * 0.2 + 0.2;
    const alpha = 0.2 + 0.3 * Math.sin(i + Date.now() * 0.0005);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- FPS ----
const fpsEl = document.getElementById('fps');
let frameCount = 0;
let lastFpsTime = performance.now();

// ---- 动画主循环 ----
function animate() {
  // 鼠标跟随（平滑）
  mouse.x += (mouse.targetX - mouse.x) * 0.03;
  mouse.y += (mouse.targetY - mouse.y) * 0.03;

  // 旋转角度
  rotY += 0.002 + mouse.x * 0.0003;
  rotX += 0.0005 + mouse.y * 0.0002;

  // 清屏
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);

  // 背景星星
  drawBgStars();

  // 按 Z 排序（远到近）
  const sorted = particles.map(p => {
    // 复制并变换
    const pp = { x: p.origX, y: p.origY, z: p.origZ };
    rotateX(pp, rotX);
    rotateY(pp, rotY);
    rotateZ(pp, rotX * 0.3);
    return { ...p, px: pp.x, py: pp.y, pz: pp.z };
  });
  sorted.sort((a, b) => b.pz - a.pz);

  // 绘制粒子
  for (const p of sorted) {
    const scale = focalLength / (focalLength + p.pz);
    const x2d = p.px * scale + W / 2;
    const y2d = p.py * scale + H / 2;

    if (x2d < -50 || x2d > W + 50 || y2d < -50 || y2d > H + 50) continue;

    const size = p.size * scale;
    const alpha = p.alpha * Math.min(1, scale * 1.5);

    // 颜色：中心偏蓝紫，外围偏红紫
    const distFromCenter = Math.hypot(p.origX, p.origY, p.origZ);
    const hue = 220 + distFromCenter * 0.15;
    const sat = 70 + 30 * (1 - distFromCenter / 600);
    const light = 40 + 40 * (1 - distFromCenter / 600);

    // 光圈
    const grad = ctx.createRadialGradient(x2d, y2d, 0, x2d, y2d, size * 4);
    grad.addColorStop(0, `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`);
    grad.addColorStop(0.3, `hsla(${hue + 20}, ${sat}%, ${light + 10}%, ${alpha * 0.3})`);
    grad.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.arc(x2d, y2d, size * 4, 0, Math.PI * 2);
    ctx.fill();

    // 核心亮星
    ctx.fillStyle = `hsla(${hue}, 80%, 85%, ${alpha * 0.8})`;
    ctx.beginPath();
    ctx.arc(x2d, y2d, size * 1.2, 0, Math.PI * 2);
    ctx.fill();
  }

  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fpsEl.textContent = `${frameCount} FPS · ${PARTICLE_COUNT} particles`;
    frameCount = 0;
    lastFpsTime = now;
  }

  requestAnimationFrame(animate);
}

// ---- 窗口变化 ----
window.addEventListener('resize', resize);

animate();

// ---- 彩蛋 ----
console.log('%c ✦ GALAXY ✦ ', 'font-size:36px; font-weight:bold; color:#c8a0ff; text-shadow:0 0 30px #80a0ff, 0 0 60px #c080ff;');
console.log('%c 4000 颗星辰，为你而旋转 ', 'font-size:14px; color:#a0c0ff;');
</script>
</body>
</html>
