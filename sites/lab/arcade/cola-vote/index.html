<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可乐大投票</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: #06060c;
    color: #f3f5f9;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== 背景 ===== */
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 45% at 15% 20%, rgba(230,26,39,.30), transparent 65%),
      radial-gradient(ellipse 55% 45% at 85% 30%, rgba(0,87,184,.30), transparent 65%),
      radial-gradient(ellipse 50% 40% at 50% 95%, rgba(0,168,89,.22), transparent 65%),
      radial-gradient(ellipse 40% 30% at 70% 60%, rgba(255,127,0,.14), transparent 65%);
    animation: glowShift 12s ease-in-out infinite alternate;
  }
  @keyframes glowShift {
    from { filter: hue-rotate(0deg) brightness(1); }
    to   { filter: hue-rotate(16deg) brightness(1.2); }
  }
  .bubbles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bubble {
    position: absolute; bottom: -80px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), rgba(255,255,255,.06) 70%);
    border: 1px solid rgba(255,255,255,.16);
    animation: rise linear infinite;
  }
  @keyframes rise { to { transform: translateY(-115vh) translateX(var(--drift, 0px)); } }

  .wrap { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding: 46px 20px 70px; }

  /* ===== 头部 ===== */
  header { text-align: center; margin-bottom: 34px; }
  .vs-badge {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
    color: rgba(255,255,255,.72);
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14);
    padding: 8px 22px; border-radius: 999px; margin-bottom: 20px; backdrop-filter: blur(8px);
  }
  .vs-badge i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  h1 {
    font-size: clamp(32px, 5.6vw, 54px); font-weight: 900; letter-spacing: 2px; line-height: 1.15;
    background: linear-gradient(100deg, #ff3b3b 0%, #ffd24a 32%, #35d07f 62%, #3d8bff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { margin-top: 12px; color: rgba(255,255,255,.6); font-size: 15px; }
  .user-chip {
    display: inline-flex; align-items: center; gap: 9px; margin-top: 18px;
    font-size: 13px; color: rgba(255,255,255,.78);
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    padding: 7px 16px; border-radius: 999px;
  }
  .user-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 9px #3ddc84; }

  /* ===== 卡片容器 ===== */
  .card {
    background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px; padding: 30px;
    backdrop-filter: blur(14px);
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }

  /* ===== 选项网格：2~4 列自适应方块 ===== */
  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (min-width: 620px) { .options { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px) { .options { grid-template-columns: repeat(4, 1fr); } }
  .option {
    position: relative; cursor: pointer; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; aspect-ratio: 1 / 1.05;
    padding: 12px; border-radius: 20px;
    background: rgba(255,255,255,.035);
    border: 1.5px solid rgba(255,255,255,.1);
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease;
    user-select: none;
  }
  .option::before {
    content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity .25s ease;
    background: radial-gradient(circle at 50% 20%, var(--c1), transparent 75%);
  }
  .option:hover { transform: translateY(-5px); border-color: var(--c1); box-shadow: 0 14px 34px var(--shadow); }
  .option:hover::before { opacity: .18; }
  .option .logo { position: relative; width: 52px; height: 52px; filter: drop-shadow(0 5px 12px rgba(0,0,0,.5)); transition: transform .25s cubic-bezier(.2,.9,.3,1.4); }
  .option:hover .logo { transform: scale(1.12) rotate(-4deg); }
  .option .logo svg { width: 100%; height: 100%; display: block; }
  .option .meta { position: relative; text-align: center; }
  .option .name { font-size: 15px; font-weight: 700; }
  .option .tag { display: block; margin-top: 4px; font-size: 11px; color: rgba(255,255,255,.5); }
  .option .check {
    position: absolute; top: 12px; right: 12px; width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.28); transition: all .2s ease;
  }
  .option.selected .check { background: var(--c1); border-color: var(--c1); box-shadow: 0 0 14px var(--c1); }
  .option.selected .check::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 5px; height: 9px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: translate(-50%, -60%) rotate(45deg);
  }
  .option.locked { cursor: default; }
  .option.locked:hover { transform: none; }
  /* 点击特效：弹跳 + 扩散光环 */
  @keyframes cardPop {
    0% { transform: scale(1); }
    35% { transform: scale(1.07) rotate(1deg); }
    70% { transform: scale(.97); }
    100% { transform: scale(1); }
  }
  @keyframes ringOut {
    from { opacity: .9; transform: scale(.3); }
    to { opacity: 0; transform: scale(2.4); }
  }
  .option.selected { animation: cardPop .45s cubic-bezier(.2,.9,.3,1.3); border-color: var(--c1); box-shadow: 0 0 0 1.5px var(--c1), 0 18px 40px var(--shadow); }
  .option.selected::before { opacity: .28; }
  .option .ring {
    content: ''; position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px;
    border-radius: 50%; border: 3px solid var(--c1); opacity: 0; pointer-events: none;
  }
  .option.selected .ring { animation: ringOut .6s ease-out; }

  /* ===== 投票气泡爆发层 ===== */
  #burst { position: fixed; inset: 0; z-index: 90; pointer-events: none; overflow: hidden; }
  .fb {
    position: absolute; bottom: -30px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.75), rgba(255,255,255,.08) 70%);
    border: 1.5px solid rgba(255,255,255,.35);
    animation: frise linear forwards;
  }
  @keyframes frise {
    0% { transform: translateY(0) translateX(0) scale(.4); opacity: 0; }
    8% { opacity: .95; }
    100% { transform: translateY(-112vh) translateX(var(--dx, 0px)) scale(1.15); opacity: 0; }
  }
  @keyframes flash { from { opacity: .5; } to { opacity: 0; } }
  .flash { position: fixed; inset: 0; z-index: 89; pointer-events: none; background: radial-gradient(circle at 50% 90%, rgba(255,255,255,.55), transparent 65%); animation: flash 1s ease-out forwards; }


  /* ===== 按钮 ===== */
  .cta {
    display: block; margin: 26px auto 0; padding: 15px 60px;
    font-size: 17px; font-weight: 800; letter-spacing: 3px; color: #fff;
    background: linear-gradient(100deg, #e61a27 0%, #7b2ff7 50%, #0057b8 100%);
    background-size: 200% 100%;
    border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 12px 34px rgba(230,26,39,.35), 0 12px 34px rgba(0,87,184,.35);
    transition: transform .2s ease, filter .2s ease, background-position .5s ease;
  }
  .cta:hover:not(:disabled) { transform: scale(1.04); filter: brightness(1.12); background-position: 100% 0; }
  .cta:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  .cta.revote:not(:disabled) { background: linear-gradient(100deg, #ff9d1b, #b83a3a, #7b2ff7); }

  .toast {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%) translateY(-90px);
    background: rgba(16,16,24,.94); border: 1px solid rgba(255,255,255,.18);
    padding: 12px 26px; border-radius: 999px; font-size: 14px; z-index: 99;
    transition: transform .35s cubic-bezier(.2,.9,.3,1.2); box-shadow: 0 10px 34px rgba(0,0,0,.55);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== 结果榜 ===== */
  .chart-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 8px; }
  .chart-head h2 { font-size: 19px; font-weight: 800; letter-spacing: 1px; }
  .chart-head span { font-size: 13px; color: rgba(255,255,255,.55); }
  .refresh-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,.8);
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    transition: all .2s ease;
  }
  .refresh-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
  .refresh-btn svg { width: 13px; height: 13px; }
  .refresh-btn.spinning svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .rows { display: flex; flex-direction: column; gap: 11px; }
  .row { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .row .mini { flex: 0 0 30px; width: 30px; height: 30px; }
  .row .mini svg { width: 100%; height: 100%; display: block; }
  .row .rname {
    flex: 0 0 clamp(104px, 15vw, 156px); min-width: 0;
    font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .track {
    flex: 1 1 auto; min-width: 0; height: 26px; border-radius: 999px; position: relative; overflow: hidden;
    background: rgba(255,255,255,.06); box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
  }
  .row .fill {
    position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--c2), var(--c1));
    box-shadow: 0 0 18px var(--shadow);
    transition: width 1.1s cubic-bezier(.2,.85,.2,1);
    overflow: hidden;
  }
  .row .fill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent);
    transform: translateX(-100%); animation: sweep 2.6s ease-in-out infinite;
  }
  @keyframes sweep { 60%, 100% { transform: translateX(100%); } }
  .row .num {
    flex: 0 0 104px; min-width: 104px; text-align: right;
    font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  .row .num b { font-size: 15px; }
  .row .num small { color: rgba(255,255,255,.45); font-weight: 500; margin-left: 4px; }
  .row.mine { padding: 5px 8px; margin: 0 -8px; border-radius: 12px; background: rgba(255,210,74,.1); border: 1px solid rgba(255,210,74,.35); }
  .row.mine .rname::after { content: ' 我的一票'; font-size: 10px; color: #ffd24a; font-weight: 700; }
  .row.top .num b { color: #ffd24a; }

  footer { text-align: center; margin-top: 26px; color: rgba(255,255,255,.32); font-size: 12px; }

  @media (max-width: 620px) {
    .option .logo { width: 42px; height: 42px; }
    .option .name { font-size: 13px; }
    .row { gap: 8px; }
    .row .rname { flex-basis: 104px; font-size: 12px; }
    .row .num { flex-basis: 86px; min-width: 86px; font-size: 12px; }
  }
</style>
  <script src="/assets/popo-shim.js"></script>
</head>
<body>
<div class="bg-glow"></div>
<div class="bubbles" id="bubbles"></div>
<div id="burst"></div>
<div class="toast" id="toast"></div>

<div class="wrap">
  <header>
    <div class="vs-badge"><i style="background:#e61a27"></i> 红 VS 蓝 <i style="background:#0057b8"></i></div>
    <h1>你喜欢喝什么样的汽水？</h1>
    <p class="subtitle">十二款快乐水同台竞技，投出你心中的第一名 🥤</p>
    <div class="user-chip"><span class="dot"></span><span id="userLabel">正在连接…</span></div>
  </header>

  <section class="card">
    <div class="options" id="options"></div>
    <button class="cta" id="voteBtn" disabled>投出宝贵一票</button>
  </section>

  <section class="card" id="resultSection" style="margin-top:24px; display:none;">
    <div class="chart-head">
      <h2>实时投票榜</h2>
      <span>共 <b id="totalVotes">0</b> 人参与 · 每个账号限投一票</span>
      <button class="refresh-btn" id="refreshBtn" title="刷新排行榜">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.34 6.34"/><path d="M20 4v7h-7"/></svg>
        刷新
      </button>
    </div>
    <div class="rows" id="rows"></div>
    <footer>数据实时保存于 Popo · 点击“刷新”可查看最新结果</footer>
  </section>
</div>

  // 百事红蓝球：真实 Pepsi 轮廓（simple-icons）置于红蓝分色圆上
  function pepsiGlobe(bgTop, bgBottom, pathFill) {
    var uid = bgTop + bgBottom;
    return '<clipPath id="clip' + uid + '"><circle cx="32" cy="32" r="27"/></clipPath>' +
      '<g clip-path="url(#clip' + uid + ')">' +
      '<rect x="5" y="5" width="54" height="27" fill="' + bgTop + '"/>' +
      '<rect x="5" y="32" width="54" height="27" fill="' + bgBottom + '"/>' +
      '</g>' + siPath(PATH_PEPSI, pathFill);
  }

  var OPTIONS = [
    { key: 'coca',      name: '可口可乐',     tag: 'Coca-Cola · 经典红标',   c1: '#ff4d4d', c2: '#c1121f', logo: badge('coca', '#f6303f', '#a30f18', siPath(PATH_COCA, '#fff')) },
    { key: 'coca_zero', name: '可口可乐零度', tag: 'Coke Zero · 无糖黑罐',   c1: '#8a8a92', c2: '#101014', logo: badge('cz', '#3a3a44', '#08080c', siPath(PATH_COCA, '#fff') + txt('ZERO', 60, 11, '#ff3b3b', 'font-family="Arial"')) },
    { key: 'pepsi',     name: '百事可乐',     tag: 'Pepsi · 蓝色风暴',       c1: '#4da3ff', c2: '#00399e', logo: badge('pep', '#1a6fe0', '#002a75', pepsiGlobe('#e61a27', '#0057b8', '#fff')) },
    { key: 'pepsi_zero', name: '百事无糖',    tag: 'Pepsi Zero · 黑罐无糖',  c1: '#6fb0e8', c2: '#0a1424', logo: badge('pz', '#16233a', '#05080f', pepsiGlobe('#c8102e', '#1f4e8c', '#fff')) },
    { key: 'pepsi_lime', name: '百事清柠',    tag: 'Pepsi Lime · 蓝罐柠檬味', c1: '#8ee04a', c2: '#0a5c8a', logo: badge('pl', '#1d7fbf', '#054a6e',
      pepsiGlobe('#c8102e', '#0a7f4f', '#fff') +
      '<g transform="translate(40,40)"><circle r="12" fill="#b7e838"/><circle r="12" fill="none" stroke="#5f9e13" stroke-width="1.8"/>' +
      '<path d="M0-12V12M-8.5-8.5l17 17M8.5-8.5l-17 17M-12 0h24" stroke="#7cbf22" stroke-width="1.5"/></g>') },
    { key: 'sprite',    name: '雪碧',         tag: 'Sprite · 透心凉柠檬味',  c1: '#3ce08a', c2: '#00703c', logo: badge('spr', '#25d97a', '#00703c',
      '<g><circle cx="32" cy="24" r="12" fill="#ffef3f"/><circle cx="32" cy="24" r="12" fill="none" stroke="#f7c600" stroke-width="2"/>' +
      '<path d="M32 13v22M23.5 15.5l17 17M40.5 15.5l-17 17M21 24h22" stroke="#f7c600" stroke-width="1.6" transform="rotate(15 32 24)" clip-path="circle(12px at 32px 24px)"/></g>' +
      txt('Sprite', 52, 13, '#fff', 'font-family="Verdana" font-style="italic"')) },
    { key: 'fanta',     name: '芬达',         tag: 'Fanta · 橙味气泡',       c1: '#ffb03a', c2: '#e35205', logo: badge('fan', '#ff9d1b', '#dc4405',
      txt('Fanta', 38, 15, '#fff', 'font-family="Verdana" font-style="italic"') +
      '<path d="M14 46c4-6 32-6 36 0-4 5-32 5-36 0z" fill="#ffef3f"/>' +
      txt('橙味汽水', 58, 9, '#fff')) },
    { key: 'pepper',    name: '胡椒博士',     tag: 'Dr Pepper · 23 种风味',  c1: '#c05050', c2: '#6b1414', logo: badge('drp', '#a5252b', '#5c0d10',
      txt('Dr', 30, 14, '#fff', 'font-family="Georgia" font-style="italic"') +
      txt('Pepper', 46, 13, '#fff', 'font-family="Georgia" font-style="italic"')) },
    { key: 'soda',      name: '苏打水/气泡水', tag: 'Sparkling · 0 糖 0 脂',  c1: '#59d8f0', c2: '#0a6b8a', logo: badge('sd', '#38c6e8', '#075a75',
      '<path d="M24 16h16v9l4 21a6 6 0 0 1-6 7H26a6 6 0 0 1-6-7l4-21z" fill="#fff" opacity=".95"/>' +
      '<circle cx="28" cy="46" r="2.6" fill="#075a75"/><circle cx="37" cy="40" r="2" fill="#075a75"/><circle cx="33" cy="50" r="1.8" fill="#075a75"/><circle cx="30" cy="34" r="1.6" fill="#075a75"/>') },
    { key: 'bby',       name: '北冰洋',       tag: '老北京 · 橘汁汽水',      c1: '#ffb347', c2: '#d4620a', logo: badge('bby', '#ff9c2a', '#c85a08',
      '<g fill="#fff"><ellipse cx="32" cy="27" rx="9" ry="7.5"/><circle cx="24.5" cy="20.5" r="3.4"/><circle cx="39.5" cy="20.5" r="3.4"/>' +
      '<ellipse cx="32" cy="39" rx="12" ry="9"/><ellipse cx="21" cy="45" rx="4" ry="3"/><ellipse cx="43" cy="45" rx="4" ry="3"/></g>' +
      '<circle cx="28.6" cy="26" r="1.5" fill="#c85a08"/><circle cx="35.4" cy="26" r="1.5" fill="#c85a08"/>' +
      '<ellipse cx="32" cy="30" rx="2.2" ry="1.6" fill="#c85a08"/>' +
      txt('北冰洋', 60, 10, '#fff')) },
    { key: 'dayao',     name: '大窑',         tag: '大窑嘉宾 · 大瓶够劲',    c1: '#ffcf4a', c2: '#a8190f', logo: badge('dy', '#e0341f', '#8c1109',
      '<path d="M12 24h40l-4 9H16z" fill="#ffcf4a"/>' +
      txt('大窑', 22, 15, '#fff') +
      txt('嘉宾', 48, 15, '#ffcf4a') +
      '<path d="M14 54h36" stroke="#ffcf4a" stroke-width="2.4" stroke-linecap="round"/>') },
    { key: 'other',     name: '其他',         tag: '崂山/元气森林/都不爱喝',  c1: '#b98cff', c2: '#5a189a', logo: badge('oth', '#a06bff', '#4a1a99', txt('?', 44, 26, '#fff')) }
  ];

  var CONF = {};
  OPTIONS.forEach(function (o) { CONF[o.key] = o; });

  var state = { user: null, identity: null, myVote: null, selected: null, voted: false };
  var $ = function (id) { return document.getElementById(id); };

  // 气泡：更多、更快
  (function makeBubbles() {
    var box = $('bubbles');
    for (var i = 0; i < 60; i++) {
      var b = document.createElement('div');
      b.className = 'bubble';
      var s = 5 + Math.random() * 24;
      b.style.width = b.style.height = s + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
      b.style.animationDuration = (3.2 + Math.random() * 5.5) + 's';
      b.style.animationDelay = -Math.random() * 9 + 's';
      b.style.opacity = 0.35 + Math.random() * 0.5;
      box.appendChild(b);
    }
  })();

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  // 外网访问时没有 Popo 账号：用“浏览器特征 + 昵称”生成稳定的匿名身份。
  var WEB_NICKNAME_KEY = 'cola_vote_web_nickname_v1';
  function simpleHash(text) {
    var hash = 2166136261;
    for (var i = 0; i < text.length; i++) {
      hash ^= text.charCodeAt(i);
      hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
    }
    return ('00000000' + (hash >>> 0).toString(16)).slice(-8);
  }

  async function digest(text) {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      var buffer = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.prototype.map.call(new Uint8Array(buffer), function (byte) {
        return ('00' + byte.toString(16)).slice(-2);
      }).join('');
    }
    return simpleHash(text);
  }

  function browserFingerprintSource() {
    var timeZone = '';
    try { timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    return [
      navigator.userAgent || '',
      navigator.language || '',
      navigator.platform || '',
      navigator.hardwareConcurrency || '',
      navigator.deviceMemory || '',
      navigator.maxTouchPoints || 0,
      screen.width || 0,
      screen.height || 0,
      screen.colorDepth || 0,
      timeZone
    ].join('|');
  }

  async function getWebIdentity() {
    var nickname = '';
    try { nickname = localStorage.getItem(WEB_NICKNAME_KEY) || ''; } catch (e) {}
    if (!nickname) {
      nickname = window.prompt('请输入昵称，用于区分同一浏览器中的不同投票者：', '');
      nickname = String(nickname || '').trim().slice(0, 24);
      if (!nickname) throw new Error('nickname-required');
      try { localStorage.setItem(WEB_NICKNAME_KEY, nickname); } catch (e) {}
    }
    var fingerprint = await digest(browserFingerprintSource());
    var identity = 'web:' + await digest(fingerprint + '|' + nickname.toLowerCase());
    return { identity: identity, nickname: nickname };
  }

  function identityFilter(identity) {
    return '$.identity == ' + JSON.stringify(identity) + ' && $.state == "active"';
  }

  async function findMyVote(identity, legacyUsername) {
    var mine = await PopSDK.data.find(OBJECT, {
      filter: { jsonPath: identityFilter(identity) },
      page: 1, pageSize: 1
    });
    // 兼容此前只保存 username、尚未保存 identity 的老记录。
    if (!mine.length && legacyUsername) {
      mine = await PopSDK.data.find(OBJECT, {
        filter: { jsonPath: '$.username == ' + JSON.stringify(legacyUsername) + ' && $.state == "active"' },
        page: 1, pageSize: 1
      });
    }
    return mine;
  }

  function shadow(c) { return c + '66'; }

  // 渲染选项
  (function renderOptions() {
    $('options').innerHTML = OPTIONS.map(function (o) {
      return '<div class="option" data-key="' + o.key + '" style="--c1:' + o.c1 + ';--c2:' + o.c2 + ';--shadow:' + shadow(o.c2) + '">' +
        '<div class="logo">' + o.logo + '</div>' +
        '<div class="meta"><div class="name">' + o.name + '</div><span class="tag">' + o.tag + '</span></div>' +
        '<div class="check"></div><div class="ring"></div></div>';
    }).join('');
    bindOptions();
  })();

  var optionEls;
  function bindOptions() {
    optionEls = document.querySelectorAll('.option');
    optionEls.forEach(function (el) {
      el.addEventListener('click', function () {
        if (state.voted) return;
        // 重新点击：先移除再添加以重播动画
        optionEls.forEach(function (o) { o.classList.remove('selected'); });
        void el.offsetWidth;
        el.classList.add('selected');
        state.selected = el.getAttribute('data-key');
        $('voteBtn').disabled = false;
      });
    });
  }

  // ===== 投票成功：泡腾片式气泡爆发 =====
  function bubbleBurst() {
    var box = $('burst');
    var flashEl = document.createElement('div');
    flashEl.className = 'flash';
    document.body.appendChild(flashEl);
    setTimeout(function () { flashEl.remove(); }, 1100);
    var n = 150;
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          var b = document.createElement('div');
          b.className = 'fb';
          var s = 6 + Math.random() * 30;
          b.style.width = b.style.height = s + 'px';
          b.style.left = Math.random() * 100 + '%';
          b.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
          b.style.animationDuration = (1.2 + Math.random() * 2.2) + 's';
          box.appendChild(b);
          setTimeout(function () { b.remove(); }, 3600);
        }, Math.random() * 900);
      })(i);
    }
  }

  $('voteBtn').addEventListener('click', onMainBtn);

  $('refreshBtn').addEventListener('click', async function () {
    var btn = $('refreshBtn');
    if (btn.classList.contains('spinning')) return;
    btn.classList.add('spinning');
    try {
      await loadCounts(state.myVote);
    } catch (e) {
      toast('刷新失败，请稍后重试');
    }
    setTimeout(function () { btn.classList.remove('spinning'); }, 600);
  });

  function render(counts, myVote) {
    var total = OPTIONS.reduce(function (s, o) { return s + (counts[o.key] || 0); }, 0);
    $('totalVotes').textContent = total;
    var sorted = OPTIONS.slice().sort(function (a, b) { return (counts[b.key] || 0) - (counts[a.key] || 0); });
    var max = Math.max(counts[sorted[0].key] || 0, 1);

    $('rows').innerHTML = sorted.map(function (o, i) {
      var n = counts[o.key] || 0;
      var pct = total ? Math.round(n / total * 100) : 0;
      var cls = 'row' + (myVote === o.key ? ' mine' : '') + (i === 0 && n > 0 ? ' top' : '');
      return '<div class="' + cls + '" style="--c1:' + o.c1 + ';--c2:' + o.c2 + ';--shadow:' + shadow(o.c2) + '">' +
        '<div class="mini">' + o.logo + '</div>' +
        '<div class="rname">' + o.name + '</div>' +
        '<div class="track"><div class="fill" data-w="' + Math.max(n ? (n / max * 100) : 0, n ? 6 : 0) + '"></div></div>' +
        '<div class="num"><b>' + n + '</b> 票 · <small>' + pct + '%</small></div>' +
        '</div>';
    }).join('');

    $('resultSection').style.display = 'block';
    requestAnimationFrame(function () {
      document.querySelectorAll('.fill').forEach(function (f) { f.style.width = f.getAttribute('data-w') + '%'; });
    });
  }

  async function loadCounts(highlight) {
    var counts = {};
    var page = 1, records;
    do {
      records = await PopSDK.data.find(OBJECT, {
        filter: { jsonPath: '$.state == "active"' },
        page: page, pageSize: 100
      });
      records.forEach(function (r) {
        var k = r.data && r.data.choice;
        if (CONF[k]) counts[k] = (counts[k] || 0) + 1;
      });
      page++;
    } while (records.length === 100);
    render(counts, highlight);
  }

  // ===== 24 小时冷静期 =====
  var COOLDOWN_MS = 24 * 60 * 60 * 1000;
  var coolTimer = null;

  function fmt(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return p(h) + ':' + p(m) + ':' + p(ss);
  }

  function startCooldown(record) {
    state.myRecord = record;
    var btn = $('voteBtn');
    clearInterval(coolTimer);
    function tick() {
      var votedAt = Date.parse(record.createdAt);
      var left = votedAt + COOLDOWN_MS - Date.now();
      if (left > 0) {
        btn.disabled = true;
        btn.classList.remove('revote');
        btn.textContent = '冷静期 ' + fmt(left) + ' 后可撤销重投';
      } else {
        btn.disabled = false;
        btn.classList.add('revote');
        btn.textContent = '撤销并重新投票';
        clearInterval(coolTimer);
      }
    }
    tick();
    coolTimer = setInterval(tick, 1000);
  }

  async function onMainBtn() {
    if (state.voted) {
      // 冷静期已过 → 撤销当前投票
      if (!state.myRecord) return;
      $('voteBtn').disabled = true;
      $('voteBtn').textContent = '撤销中…';
      try {
        await PopSDK.data.update(OBJECT, state.myRecord.id, { state: 'removed' });
        state.voted = false;
        state.myVote = null;
        state.selected = null;
        state.myRecord = null;
        clearInterval(coolTimer);
        toast('已撤销，你可以重新投票');
        unlockUI();
        await loadCounts(null);
      } catch (e) {
        toast('撤销失败，请稍后重试');
        startCooldown(state.myRecord);
      }
      return;
    }
    if (!state.selected) return;
    var btn = $('voteBtn');
    btn.disabled = true;
    btn.textContent = '提交中…';
    try {
      var created = await PopSDK.data.create(OBJECT, {
        username: state.identity,
        identity: state.identity,
        choice: state.selected,
        state: 'active'
      });
      state.voted = true;
      state.myVote = state.selected;
      toast('投票成功！你的一票投给了「' + CONF[state.myVote].name + '」🎉');
      bubbleBurst();
      lockUI();
      startCooldown(created);
      await loadCounts(state.myVote);
    } catch (err) {
      toast('提交失败，请稍后重试');
      btn.disabled = false;
      btn.textContent = '投出宝贵一票';
    }
  }

  function lockUI() {
    optionEls.forEach(function (o) {
      o.classList.add('locked');
      if (o.getAttribute('data-key') === state.myVote) o.classList.add('selected');
    });
  }

  function unlockUI() {
    optionEls.forEach(function (o) { o.classList.remove('locked'); o.classList.remove('selected'); });
    var btn = $('voteBtn');
    btn.disabled = true;
    btn.classList.remove('revote');
    btn.textContent = '投出宝贵一票';
  }

  async function init() {
    try {
      await PopSDK.ready();
      var me = null;
      try {
        me = await PopSDK.user.info();
        if (!me || !me.userName) throw new Error('anonymous-user');
        state.user = me;
        state.identity = 'user:' + me.userName;
        $('userLabel').textContent = '身份已就绪 · 每人限投一票';
      } catch (identityError) {
        var anonymous = await getWebIdentity();
        state.identity = anonymous.identity;
        $('userLabel').textContent = '匿名身份已就绪 · 每人限投一票';
      }

      var mine = await findMyVote(state.identity, me && me.userName);
      if (mine.length > 0) {
        state.voted = true;
        state.myVote = mine[0].data.choice;
        lockUI();
        startCooldown(mine[0]);
      }
      await loadCounts(state.myVote);
    } catch (e) {
      if (e && e.message === 'nickname-required') {
        $('userLabel').textContent = '请输入昵称后参与投票';
        toast('需要输入昵称才能参与投票');
        try { await loadCounts(null); } catch (loadError) {}
      } else {
        $('userLabel').textContent = '连接失败，请刷新页面重试';
        toast('加载失败，请稍后刷新重试');
      }
    }
  }

  init();
})();
</script>
