<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>车速保持挑战 · 跟着限速牌稳住车速</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141a26; --panel2:#1b2332; --line:#273246;
    --txt:#e8eef7; --muted:#8a97ad; --accent:#ffce3a; --danger:#ff4d4f;
    --ok:#2fd27a; --speed:#39b6ff; --warn:#ffb020;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#16202f 0%,var(--bg) 60%);
    color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    display:flex;justify-content:center;padding:16px;min-height:100%;transition:background .25s;
  }
  body.warn{background:radial-gradient(1200px 700px at 50% -10%,#3a3410 0%,#1a1708 60%)}
  body.danger{background:radial-gradient(1200px 700px at 50% -10%,#3a1210 0%,#1a0808 60%)}
  .wrap{width:100%;max-width:960px;display:grid;grid-template-columns:1.3fr .9fr;gap:16px}
  @media(max-width:760px){.wrap{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--line);border-radius:18px;padding:18px}
  .card.leader{display:flex;flex-direction:column;overflow:hidden}
  .wrap{align-items:start}
  header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;letter-spacing:1px}
  h1 .sub{display:block;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:3px}
  .me{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .me img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#2a3346;border:1px solid var(--line)}
  .gauges{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative}
  .frame{position:absolute;inset:0;border-radius:18px;pointer-events:none;border:3px solid transparent;transition:border-color .2s,box-shadow .2s}
  body.warn .frame{border-color:var(--warn);box-shadow:inset 0 0 40px rgba(255,176,32,.25)}
  body.danger .frame{border-color:var(--danger);box-shadow:inset 0 0 50px rgba(255,77,79,.35)}
  /* 限速标牌区 */
  .levelBadge{font-size:13px;font-weight:800;letter-spacing:1px;color:#1a1300;background:var(--accent);
    padding:5px 14px;border-radius:999px}
  .signs{display:flex;gap:16px;align-items:center;justify-content:center;min-height:120px}
  .sign{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .35s ease}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .sign .disc{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;line-height:1;position:relative}
  .sign.max .disc{background:#fff;border:9px solid #d8291c;color:#111;font-size:40px}
  .sign.min .disc{background:#1e52d6;color:#fff;font-size:40px}
  .sign .cap{font-size:12px;color:var(--muted)}
  .signHint{text-align:center;font-size:13px;color:var(--muted);min-height:18px}
  .signHint b{color:var(--accent)}
  .speedo{position:relative;width:280px;max-width:84vw;aspect-ratio:1/0.62}
  .speedo svg{width:100%;height:100%;overflow:visible}
  .digi{position:absolute;left:0;right:0;bottom:4%;text-align:center}
  .digi .v{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .digi .u{font-size:12px;color:var(--muted);letter-spacing:2px}
  .state{font-size:14px;font-weight:600;height:20px;letter-spacing:1px}
  .state.ok{color:var(--ok)} .state.bad{color:var(--danger)} .state.go{color:var(--accent)} .state.warn{color:var(--warn)}
  .survive{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;color:var(--ok);height:40px}
  .survive small{font-size:14px;color:var(--muted);font-weight:600}
  .meter{width:100%;max-width:300px}
  .meter label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
  .bar{height:12px;border-radius:8px;background:#0d1420;border:1px solid var(--line);overflow:hidden;position:relative}
  .bar > i{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:8px;background:linear-gradient(90deg,#39b6ff,#2fd27a)}
  .bal{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.8}
  .controls{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
  .pedal{user-select:none;cursor:pointer;width:100%;max-width:300px;height:104px;border-radius:16px;
    border:1px solid var(--line);background:linear-gradient(180deg,#20304a,#16202f);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
    font-weight:800;font-size:19px;letter-spacing:2px;transition:transform .05s,box-shadow .1s,background .1s;
    box-shadow:0 8px 0 #0c121c,0 10px 20px rgba(0,0,0,.4)}
  .pedal small{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
  .pedal.active{background:linear-gradient(180deg,#3a2a16,#2a1e10);transform:translateY(6px);box-shadow:0 2px 0 #0c121c,0 4px 10px rgba(0,0,0,.4);color:var(--accent)}
  .pedal.disabled{opacity:.45;pointer-events:none}
  .btn{appearance:none;border:none;cursor:pointer;border-radius:12px;padding:14px 26px;font-size:16px;font-weight:800;letter-spacing:1px;
    background:var(--accent);color:#1a1300;transition:filter .1s,transform .05s;width:100%;max-width:300px}
  .btn:active{transform:translateY(1px)}
  .hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;max-width:340px}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-shrink:0}
  .tab{flex:1;text-align:center;padding:9px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--accent);color:#1a1300;border-color:var(--accent)}
  .board{display:flex;flex-direction:column;gap:6px;flex:1;min-height:120px;overflow-y:auto;padding-right:4px}
  .board::-webkit-scrollbar{width:7px}
  .board::-webkit-scrollbar-thumb{background:#2a3650;border-radius:4px}
  .board::-webkit-scrollbar-track{background:transparent}
  @media(max-width:760px){.card.leader{max-height:72vh}}
  .row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#0e1522;border:1px solid transparent}
  .row.meRow{border-color:var(--accent);background:#1a1a10}
  .row .rk{width:26px;text-align:center;font-weight:800;color:var(--muted)}
  .row .rk.g{color:#ffce3a}.row .rk.s{color:#cdd6e4}.row .rk.b{color:#e0a05a}
  .row img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#2a3346}
  .row .nm{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .tm{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ok);font-size:14px}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:13px}
  .foot{grid-column:1/-1;text-align:center;color:var(--muted);font-size:11px}
  .mybest{font-size:12px;color:var(--muted);margin-top:10px;text-align:center;flex-shrink:0}
  .mybest b{color:var(--accent)}
</style>
  <script src="/assets/popo-shim.js"></script>
  <link rel="icon" href="/assets/favicon.svg">
</head>
<body>
<div class="wrap">
  <header>
    <h1>车速保持挑战<span class="sub">看限速牌，把车速稳在范围内，越久越强</span></h1>
    <div class="me" id="me"><img id="meAvatar" alt=""><span id="meName">加载身份中…</span></div>
  </header>

  <section class="card gauges">
    <div class="frame"></div>
    <div class="levelBadge" id="levelBadge">准备开始</div>
    <div class="signs" id="signs"></div>
    <div class="signHint" id="signHint"></div>
    <div class="state go" id="state">准备就绪</div>
    <div class="speedo">
      <svg viewBox="0 0 200 124" id="svg"></svg>
      <div class="digi"><div class="v" id="spd">0</div><div class="u">KM / H</div></div>
    </div>
    <div class="survive" id="survive">0.0<small> s</small></div>
    <div class="meter">
      <label><span>刹车力度</span><span id="forceVal">0 N</span></label>
      <div class="bar"><i id="forceBar"></i><span class="bal" id="balMark"></span></div>
    </div>
    <div class="controls">
      <div class="pedal disabled" id="pedal">制动踏板<small>按住减速 · 松开自然提速（空格也可）</small></div>
      <button class="btn" id="startBtn">开始游戏</button>
      <div class="hint">红牌=最高限速，蓝牌=最低限速，两者可单独或同时出现。每 10 秒换一次牌、难度递增，换牌后有缓冲时间调整。车速低于下限 20%、高于上限 20%、归零、冲到 200、或刹车力度踩到 2000N 把踏板踩断，都会结束。偏差 10% 变黄，21% 变红即结束。无尽模式，坚持越久排名越高。</div>
    </div>
  </section>

  <section class="card leader">
    <div class="tabs">
      <div class="tab on" id="tabToday">今日榜</div>
      <div class="tab" id="tabAll">总榜</div>
    </div>
    <div class="board" id="board"><div class="empty">加载中…</div></div>
    <div class="mybest" id="mybest"></div>
  </section>

  <div class="foot">成绩与排名由 popo 身份实时记录 · 车速保持挑战 V1</div>
</div>
<script>
/* ====== 参数 ====== */
const ACCEL_ASYMPTOTE=240;   // ease-out 渐近线
const MAX_SPEED=200;         // 到达即失败
const F_BAL=400;             // 平衡力度：此处刹车与发动机持平（匀速）
const K_UP=0.1375;           // 自然加速系数（保持原有提速节奏：K_UP*F_BAL 不变）
const K_DOWN=0.055;          // 制动系数
// 制动效能随速度轻微变化：高速压制略弱、低速略强，但差距只有约 10%
const DECEL_DROP=0.10;       // 从 0km/h 到极速，效能线性下降 10%
const PRESS_V0=400, PRESS_ACCEL=4000;     // 踩下力度增长（较灵敏）
const RELEASE_V0=600, RELEASE_ACCEL=12000;// 松开力度回落
const MAX_FORCE=2000;        // 力度达到 2000N 刹车踏板断裂，游戏结束
const ROUND_MS=10000;        // 每 10 秒换一次限速牌
const REACTION_S=1;          // 反应时间
const DECEL_ASSUMED=50;      // 估算制动减速（用于计算缓冲时长）
const YELLOW_PCT=10, FAIL_PCT=20;
const GAME_VERSION='V1';

/* ====== 速度表 ====== */
const SVG="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
const CX=100,CY=108,R=86,A0=180,A1=0;
function pol(cx,cy,r,deg){const a=deg*Math.PI/180;return[cx+r*Math.cos(a),cy-r*Math.sin(a)];}
function val2deg(v){return A0-(A0-A1)*(Math.min(v,MAX_SPEED)/MAX_SPEED);}
let bandArc=null, labels=[];
(function buildDial(){
  const [sx,sy]=pol(CX,CY,R,A0),[ex,ey]=pol(CX,CY,R,A1);
  const arc=document.createElementNS(SVG,'path');
  arc.setAttribute('d',`M ${sx} ${sy} A ${R} ${R} 0 0 1 ${ex} ${ey}`);
  arc.setAttribute('fill','none');arc.setAttribute('stroke','#273246');arc.setAttribute('stroke-width','10');
  arc.setAttribute('stroke-linecap','round');svg.appendChild(arc);
  // 目标区间高亮弧（随限速牌更新）
  bandArc=document.createElementNS(SVG,'path');
  bandArc.setAttribute('fill','none');bandArc.setAttribute('stroke','#2fd27a');bandArc.setAttribute('stroke-width','10');
  bandArc.setAttribute('opacity','0.5');svg.appendChild(bandArc);
  // 刻度：每 10 一根；40 最长最粗、20 居中、10 最短
  for(let v=0;v<=MAX_SPEED;v+=10){
    const major=v%40===0, mid=v%20===0;
    const inner=R-(major?10:mid?7:4.5);
    const [a,b]=pol(CX,CY,inner,val2deg(v)),[c,d]=pol(CX,CY,R,val2deg(v));
    const t=document.createElementNS(SVG,'line');
    t.setAttribute('x1',a);t.setAttribute('y1',b);t.setAttribute('x2',c);t.setAttribute('y2',d);
    t.setAttribute('stroke',major?'#6b7a90':'#45515f');
    t.setAttribute('stroke-width',major?'2':mid?'1.2':'0.7');
    t.setAttribute('stroke-linecap','round');svg.appendChild(t);
  }
  // 数字：每 10 都显示，40 的倍数更大；指针靠近时放大（dock 放大效果）
  for(let v=0;v<=MAX_SPEED;v+=10){
    const major=v%40===0;
    const base=major?6.5:5;
    const [lx,ly]=pol(CX,CY,R-21,val2deg(v));
    const tx=document.createElementNS(SVG,'text');
    tx.setAttribute('x',lx);tx.setAttribute('y',ly);
    tx.setAttribute('text-anchor','middle');tx.setAttribute('dominant-baseline','central');
    tx.setAttribute('fill','#8a97ad');tx.setAttribute('font-size',base);
    tx.textContent=v;svg.appendChild(tx);
    labels.push({value:v,el:tx,base});
  }
  const needle=document.createElementNS(SVG,'line');
  needle.setAttribute('id','needle');needle.setAttribute('x1',CX);needle.setAttribute('y1',CY);
  const [nx,ny]=pol(CX,CY,R-14,A0);needle.setAttribute('x2',nx);needle.setAttribute('y2',ny);
  needle.setAttribute('stroke','#39b6ff');needle.setAttribute('stroke-width','3');needle.setAttribute('stroke-linecap','round');
  svg.appendChild(needle);
  const hub=document.createElementNS(SVG,'circle');hub.setAttribute('cx',CX);hub.setAttribute('cy',CY);
  hub.setAttribute('r','5');hub.setAttribute('fill','#39b6ff');svg.appendChild(hub);
})();
const DOCK_SIGMA=13, DOCK_BOOST=1.7;
function updateLabels(v){
  for(const L of labels){
    const d=Math.abs(L.value-v);
    const f=Math.exp(-(d*d)/(2*DOCK_SIGMA*DOCK_SIGMA)); // 越近越接近 1
    const size=L.base*(1+DOCK_BOOST*f);
    L.el.setAttribute('font-size',size.toFixed(2));
    L.el.setAttribute('opacity',(0.3+0.7*f).toFixed(2));
    L.el.setAttribute('fill',f>0.55?'#ffce3a':'#8a97ad');
    L.el.setAttribute('font-weight',f>0.4?'800':'400');
  }
}
function drawNeedle(v){const [nx,ny]=pol(CX,CY,R-14,val2deg(v));const n=document.getElementById('needle');
  n.setAttribute('x2',nx);n.setAttribute('y2',ny);updateLabels(v);}
function drawBand(lo,hi){
  if(lo==null&&hi==null){bandArc.setAttribute('d','');return;}
  const a=lo==null?0:lo, b=hi==null?MAX_SPEED:hi;
  const [sx,sy]=pol(CX,CY,R,val2deg(a)),[ex,ey]=pol(CX,CY,R,val2deg(b));
  const large=0; const sweep=1;
  bandArc.setAttribute('d',`M ${sx} ${sy} A ${R} ${R} 0 ${large} ${sweep} ${ex} ${ey}`);
}

/* ====== 状态 ====== */
const el={state:g('state'),spd:g('spd'),survive:g('survive'),forceBar:g('forceBar'),forceVal:g('forceVal'),
  balMark:g('balMark'),pedal:g('pedal'),start:g('startBtn'),signs:g('signs'),signHint:g('signHint')};
function g(id){return document.getElementById(id);}

let phase='idle';            // idle | run | done
let speed=0, force=0, rampRate=0, dropRate=0, pressing=false;
let surviveMs=0, roundMs=ROUND_MS, lastTs=0, hasMoved=false;
let sign=null, graceLeft=0, prevTarget=0, level=0;
let resultMs=null;

function setState(t,c){el.state.textContent=t;el.state.className='state'+(c?' '+c:'');}
(function initBal(){el.balMark.style.left=(F_BAL/MAX_FORCE*100)+'%';})();

/* ====== 限速牌生成（按难度级别）====== */
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
// 各级别的区间宽度（上限-下限）；1 仅上限、2 仅下限返回 null
function widthForLevel(lv){
  if(lv>=21)return 10;
  if(lv>=16)return 20;
  if(lv>=11)return 30;
  if(lv>=6)return 40;
  if(lv===5)return 60;
  if(lv===4)return 70;
  if(lv===3)return 80;
  return null;
}
function makeSign(lv){
  if(lv===1)return {min:null,max:rnd(6,12)*10};   // 第一级：仅上限
  if(lv===2)return {min:rnd(8,15)*10,max:null};    // 第二级：仅下限
  const w=widthForLevel(lv);                        // 三级起：区间，宽度随级别收窄
  const min=rnd(3,Math.floor((180-w)/10))*10;       // 区间落在 [30,180]
  return {min,max:min+w};
}
function levelText(lv){
  if(lv===1)return '第 1 级 · 仅限最高速';
  if(lv===2)return '第 2 级 · 仅限最低速';
  return '第 '+lv+' 级 · 区间宽度 '+widthForLevel(lv);
}
function signCenter(s){
  if(s.min!=null&&s.max!=null)return (s.min+s.max)/2;
  if(s.max!=null)return s.max*0.85;
  return Math.min(s.min*1.15,180);
}
function graceFor(s,cur){
  const target=signCenter(s);
  let t;
  if(target>=cur){ // 需自然提速：按 ease-out 积分求时间
    const A=ACCEL_ASYMPTOTE, c=K_UP*F_BAL;
    const s0=Math.min(cur,A-1), s1=Math.min(target,A-1);
    t=(A/c)*Math.log((A-s0)/(A-s1));
  }else{           // 需刹车降速：按假定减速估算
    t=(cur-target)/DECEL_ASSUMED;
  }
  return Math.max(1,Math.min(7,t+REACTION_S));
}
function renderSign(){
  el.signs.innerHTML='';
  const add=(cls,num,cap)=>{
    const d=document.createElement('div');d.className='sign '+cls;
    d.innerHTML=`<div class="disc">${num}</div><div class="cap">${cap}</div>`;
    el.signs.appendChild(d);
  };
  if(sign.max!=null)add('max',sign.max,'最高限速');
  if(sign.min!=null)add('min',sign.min,'最低限速');
  drawBand(sign.min,sign.max);
}
function nextSign(){
  prevTarget=signCenter(sign||{max:speed});
  level++;
  sign=makeSign(level);
  graceLeft=graceFor(sign,speed);
  roundMs=0;
  renderSign();
  document.getElementById('levelBadge').textContent=levelText(level);
}

/* 当前车速相对限速牌的偏差百分比（0=在范围内） */
function deviation(){
  let over=0,under=0;
  if(sign.max!=null&&speed>sign.max)over=(speed-sign.max)/sign.max*100;
  if(sign.min!=null&&speed<sign.min)under=(sign.min-speed)/sign.min*100;
  return Math.max(over,under);
}

/* ====== 渲染 ====== */
function render(){
  drawNeedle(speed);
  el.spd.textContent=Math.round(speed);
  el.forceBar.style.width=Math.min(force/MAX_FORCE,1)*100+'%';
  el.forceVal.textContent=Math.round(force)+' N';
  if(phase==='run')el.survive.innerHTML=(surviveMs/1000).toFixed(1)+'<small> s</small>';
}
function setTint(level){ // '', 'warn', 'danger'
  document.body.classList.toggle('warn',level==='warn');
  document.body.classList.toggle('danger',level==='danger');
  el.spd.style.color = level==='danger'?'#ff4d4f':(level==='warn'?'#ffb020':(speed>180?'#ff4d4f':'#39b6ff'));
}

/* ====== 主循环 ====== */
function loop(ts){
  if(phase!=='run'){render();return;}
  if(!lastTs)lastTs=ts;
  let dt=(ts-lastTs)/1000;lastTs=ts;
  if(dt>0.1)dt=0.1;
  surviveMs+=dt*1000; roundMs+=dt*1000;
  if(graceLeft>0)graceLeft-=dt;
  if(roundMs>=ROUND_MS)nextSign();

  // 力度
  if(pressing){
    rampRate+=PRESS_ACCEL*dt;force+=rampRate*dt;
    if(force>=MAX_FORCE){force=MAX_FORCE;render();return fail('刹车踏板断裂（力度超 2000 N）');}
  }else if(force>0){
    dropRate+=RELEASE_ACCEL*dt;force-=dropRate*dt;if(force<0)force=0;
  }
  // 车速：F_BAL 处平衡
  if(force<F_BAL){
    const a=K_UP*(F_BAL-force)*Math.max(0,1-speed/ACCEL_ASYMPTOTE);
    speed+=a*dt;
  }else{
    const eff=1-DECEL_DROP*(speed/MAX_SPEED); // 高速压制略弱、低速略强，差距约 10%
    speed-=K_DOWN*(force-F_BAL)*eff*dt;
    if(speed<0)speed=0;
  }
  if(speed>30)hasMoved=true;

  // 全局失败
  if(speed>=MAX_SPEED){speed=MAX_SPEED;return fail('超速失控（≥200）');}
  if(hasMoved&&speed<=0){return fail('车速归零');}

  // 限速牌判定（缓冲期内只提示不判负）
  const d=deviation();
  if(graceLeft>0){
    setTint('');
    const over=sign.max!=null&&speed>sign.max, under=sign.min!=null&&speed<sign.min;
    el.signHint.innerHTML='调整缓冲 <b>'+graceLeft.toFixed(1)+'s</b> · '+
      (over?'请减速进入范围':under?'请提速进入范围':'已在范围内，保持');
    if(!(over||under)){setState('已进入限速范围','ok');}else{setState('调整中…','go');}
  }else{
    el.signHint.innerHTML='本牌剩余 <b>'+Math.max(0,(ROUND_MS-roundMs)/1000).toFixed(1)+'s</b> · 稳住车速';
    if(d>FAIL_PCT){setTint('danger');return fail(describeFail());}
    else if(d>=YELLOW_PCT){setTint('warn');setState('偏差 '+Math.round(d)+'% · 快回到范围！','warn');}
    else{setTint('');setState('保持良好','ok');}
  }
  render();
  requestAnimationFrame(loop);
}
function describeFail(){
  if(sign.max!=null&&speed>sign.max)return '超速超过 20%';
  if(sign.min!=null&&speed<sign.min)return '低于限速 20%';
  return '偏差超过 20%';
}

function startGame(){
  phase='run';speed=0;force=0;rampRate=0;dropRate=0;pressing=false;
  surviveMs=0;roundMs=ROUND_MS;lastTs=0;hasMoved=false;resultMs=null;sign=null;prevTarget=0;level=0;
  document.body.classList.remove('warn','danger');
  el.pedal.classList.remove('disabled','active');el.start.style.display='none';
  el.survive.innerHTML='0.0<small> s</small>';
  nextSign(); // 立刻出第一张牌（带缓冲）
  setState('出发！跟着限速牌走','go');
  requestAnimationFrame(loop);
}
function fail(reason){
  phase='done';pressing=false;resultMs=Math.round(surviveMs);
  el.pedal.classList.add('disabled');el.pedal.classList.remove('active');
  setState('结束：'+reason+' · 坚持 '+(resultMs/1000).toFixed(1)+'s','bad');
  el.signHint.textContent='';
  el.start.textContent='再来一次';el.start.style.display='';
  setTint('danger');render();
  submitScore(resultMs);
}

/* ====== 踏板 ====== */
function pressDown(){if(phase!=='run')return;pressing=true;rampRate=PRESS_V0;el.pedal.classList.add('active');}
function pressUp(){if(phase!=='run')return;pressing=false;dropRate=RELEASE_V0;el.pedal.classList.remove('active');}
el.pedal.addEventListener('mousedown',e=>{e.preventDefault();pressDown();});
window.addEventListener('mouseup',pressUp);
el.pedal.addEventListener('touchstart',e=>{e.preventDefault();pressDown();},{passive:false});
window.addEventListener('touchend',pressUp);
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)pressDown();}});
window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();pressUp();}});
el.start.addEventListener('click',startGame);
render();
</script>
<script>
/* ====== popo 身份 + 排行榜（坚持最久）====== */
const OBJ='score';
const SDK=window.PopSDK||null;
let myId=null, allScores=[], myRec=null, curTab='today';
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}

async function initIdentity(){
  try{
    if(SDK&&SDK.user&&SDK.user.info){
      const me=await SDK.user.info();
      myId={userName:me.userName||'anonymous',nickname:me.nickname||me.userName||'匿名用户',avatar:me.avatar||''};
    }else{myId={userName:'preview',nickname:'本地预览',avatar:''};}
  }catch(e){myId={userName:'anonymous',nickname:'匿名用户',avatar:''};}
  const av=document.getElementById('meAvatar');
  if(myId.avatar){av.src=myId.avatar;}else{av.style.display='none';}
  document.getElementById('meName').textContent='你好，'+myId.nickname;
}
async function loadScores(){
  allScores=[];
  if(SDK&&SDK.data&&SDK.data.find){
    let page=1;
    while(true){let recs;
      try{recs=await SDK.data.find(OBJ,{filter:{jsonPath:'$.state == "active"'},
        order:[{expression:'created_at DESC'}],page,pageSize:100});}catch(e){break;}
      if(!recs||!recs.length)break;allScores=allScores.concat(recs);
      if(recs.length<100)break;page++;if(page>20)break;}
  }else{try{allScores=JSON.parse(localStorage.getItem('sk_scores')||'[]');}catch(e){allScores=[];}}
  myRec=allScores.find(r=>r.data&&r.data.user_name===myId.userName&&r.data.version===GAME_VERSION)||null;
  renderBoard();
}
function medal(i){return i===0?'g':i===1?'s':i===2?'b':'';}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderBoard(){
  const board=document.getElementById('board');const today=todayStr();
  let rows=allScores.map(r=>r.data).filter(d=>d&&d.version===GAME_VERSION);
  let list;
  if(curTab==='today')list=rows.filter(d=>d.day===today&&d.today_ms!=null).map(d=>({...d,_ms:d.today_ms}));
  else list=rows.filter(d=>d.best_ms!=null).map(d=>({...d,_ms:d.best_ms}));
  list.sort((a,b)=>b._ms-a._ms); // 坚持越久越靠前
  if(!list.length){board.innerHTML='<div class="empty">还没有成绩，来当第一个保持大师！</div>';}
  else board.innerHTML=list.map((d,i)=>{
    const me=d.user_name===myId.userName?' meRow':'';
    const av=d.avatar?`<img src="${d.avatar}" alt="">`:`<img alt="">`;
    return `<div class="row${me}"><div class="rk ${medal(i)}">${i+1}</div>${av}`+
      `<div class="nm">${escapeHtml(d.nickname||d.user_name)}</div>`+
      `<div class="tm">${(d._ms/1000).toFixed(1)} s</div></div>`;}).join('');
  const mb=document.getElementById('mybest');
  if(myRec&&myRec.data){const b=myRec.data.best_ms;const t=myRec.data.day===today?myRec.data.today_ms:null;
    mb.innerHTML='我坚持最久：<b>'+(b!=null?(b/1000).toFixed(1)+' s':'—')+'</b>'+
      (t!=null?'　今日最久：<b>'+(t/1000).toFixed(1)+' s</b>':'');}
  else mb.textContent='';
}
async function submitScore(ms){
  const today=todayStr();
  const base={user_name:myId.userName,nickname:myId.nickname,avatar:myId.avatar,version:GAME_VERSION};
  try{
    if(SDK&&SDK.data){
      if(!myRec){const rec=await SDK.data.create(OBJ,{...base,best_ms:ms,today_ms:ms,day:today,plays:1,state:'active'});
        myRec=rec;allScores.push(rec);}
      else{const d=myRec.data;const patch={...base,plays:(d.plays||0)+1};
        if(d.best_ms==null||ms>d.best_ms)patch.best_ms=ms;           // 取最久
        if(d.day!==today){patch.day=today;patch.today_ms=ms;}
        else if(d.today_ms==null||ms>d.today_ms)patch.today_ms=ms;
        const rec=await SDK.data.update(OBJ,myRec.id,patch);
        myRec=rec;const i=allScores.findIndex(r=>r.id===rec.id);if(i>=0)allScores[i]=rec;}
    }else{
      if(!myRec){myRec={id:Date.now(),data:{...base,best_ms:ms,today_ms:ms,day:today,plays:1,state:'active'}};allScores.push(myRec);}
      else{const d=myRec.data;d.plays=(d.plays||0)+1;Object.assign(d,base);
        if(d.best_ms==null||ms>d.best_ms)d.best_ms=ms;
        if(d.day!==today){d.day=today;d.today_ms=ms;}else if(ms>d.today_ms)d.today_ms=ms;}
      localStorage.setItem('sk_scores',JSON.stringify(allScores));
    }
  }catch(e){console.warn('提交成绩失败',e);}
  renderBoard();
}
document.getElementById('tabToday').addEventListener('click',()=>{curTab='today';
  document.getElementById('tabToday').classList.add('on');document.getElementById('tabAll').classList.remove('on');renderBoard();});
document.getElementById('tabAll').addEventListener('click',()=>{curTab='all';
  document.getElementById('tabAll').classList.add('on');document.getElementById('tabToday').classList.remove('on');renderBoard();});
/* 让排行榜卡片高度对齐左侧游戏卡片，内部滚动，不把页面撑高 */
function syncBoardHeight(){
  const left=document.querySelector('.card.gauges');
  const right=document.querySelector('.card.leader');
  if(!left||!right)return;
  if(window.innerWidth>760){right.style.height=left.offsetHeight+'px';}else{right.style.height='';}
}
window.addEventListener('resize',syncBoardHeight);
(async function(){await initIdentity();await loadScores();syncBoardHeight();setTimeout(syncBoardHeight,250);})();
</script>
</body>
