<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git 常用命令速查表</title>
<style>
:root{
  --bg:#0e1f2d;--bg2:#0a1822;--panel:#13293a;--panel2:#16304353;
  --ink:#e8f1f5;--dim:#8fa7b3;--line:#1f3d52;
  --pink:#ec2e7a;--pink2:#ff5fa0;--lime:#b6e23b;--lime-dim:#7f9f3a;
  --cmd:#d7e6ec;--arg:#ffd36b;
  --mono:"SF Mono","JetBrains Mono","Fira Code",Consolas,Menlo,"DejaVu Sans Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);color:var(--ink);line-height:1.6;
  background:radial-gradient(1200px 700px at 15% -10%,#163247 0%,transparent 55%),
             radial-gradient(1000px 600px at 110% 10%,#102a3d 0%,transparent 50%),
             linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;min-height:100vh;padding:0 0 60px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header{padding:48px 0 22px}
.title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.title h1{
  font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:.5px;
  color:var(--lime);text-shadow:0 0 24px rgba(182,226,59,.25);
}
.title h1 .g{color:#fff}
.title .ver{font:600 12px/1 var(--mono);color:var(--dim);
  border:1px solid var(--line);padding:5px 9px;border-radius:20px;letter-spacing:.5px}
.subtitle{color:var(--dim);margin-top:8px;font-size:15px}
.subtitle b{color:var(--lime-dim);font-weight:600}

/* search */
.toolbar{position:sticky;top:0;z-index:30;padding:16px 0 10px;
  background:linear-gradient(180deg,var(--bg) 60%,transparent);backdrop-filter:blur(2px)}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:2}
#q{
  width:100%;font:500 16px/1.2 var(--sans);color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 110px 14px 46px;outline:none;transition:.2s;
}
#q::placeholder{color:#5f7886}
#q:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(236,46,122,.18)}
.search .kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12px}
.search .kbd kbd{font:600 11px/1 var(--mono);background:#0c1c28;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:4px 6px;color:var(--dim)}
#count{color:var(--dim);font-size:13px;margin:4px 2px 0}
#count b{color:var(--lime)}

/* legend */
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 26px;
  border:1px solid var(--lime-dim);border-radius:12px;padding:16px;
  background:linear-gradient(180deg,rgba(182,226,59,.06),rgba(182,226,59,.02))}
.legend .lg{display:flex;flex-direction:column;gap:3px;min-width:0}
.legend code{font:700 15px/1 var(--mono);color:var(--lime)}
.legend span{color:var(--dim);font-size:13px}

/* grid of cards */
.grid{columns:2;column-gap:22px}
.card{break-inside:avoid;display:inline-block;width:100%;margin:0 0 22px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 10px 30px -18px rgba(0,0,0,.7)}
.card h2{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:#fff;
  padding:13px 18px;background:linear-gradient(90deg,var(--pink),var(--pink2));letter-spacing:.3px}
.card h2 .n{margin-left:auto;font:600 12px/1 var(--mono);background:rgba(0,0,0,.22);
  padding:4px 8px;border-radius:20px}
.rows{padding:6px}

/* command row */
.row{display:block;width:100%;text-align:left;cursor:pointer;border:0;background:transparent;
  padding:10px 12px;border-radius:10px;transition:background .15s;position:relative;color:inherit}
.row:hover{background:var(--panel2)}
.row:focus-visible{outline:2px solid var(--pink);outline-offset:-2px}
.cmd{font:600 14.5px/1.5 var(--mono);color:var(--cmd);word-break:break-word}
.cmd .p{color:var(--lime-dim)}
.cmd .a{color:var(--arg)}
.desc{display:block;color:var(--dim);font-size:13px;margin-top:3px}
.copy{position:absolute;right:10px;top:10px;opacity:0;transition:.15s;
  font-size:11px;color:var(--dim);display:flex;align-items:center;gap:4px}
.row:hover .copy{opacity:1}
.copy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.row.copied{background:rgba(182,226,59,.12)}
.row.copied .copy{opacity:1;color:var(--lime)}

mark{background:rgba(255,211,107,.28);color:var(--arg);border-radius:3px;padding:0 1px}
.empty{display:none;color:var(--dim);text-align:center;padding:60px 20px;font-size:15px}
.empty.show{display:block}

/* toast */
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);
  background:var(--lime);color:#13293a;font-weight:700;font-size:14px;
  padding:11px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:.25s;
  box-shadow:0 10px 30px -8px rgba(182,226,59,.5);z-index:50;display:flex;gap:8px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg{width:16px;height:16px;stroke:#13293a;fill:none;stroke-width:2.4}

footer{color:var(--dim);font-size:12.5px;text-align:center;margin-top:34px;
  padding-top:22px;border-top:1px dashed var(--line);font-family:var(--mono)}
footer a{color:var(--lime-dim);text-decoration:none}
footer a:hover{color:var(--lime)}

@media(max-width:820px){
  .grid{columns:1}
  .legend{grid-template-columns:repeat(2,1fr)}
  .search .kbd{display:none}
  #q{padding-right:16px}
  header{padding:34px 0 14px}
}
</style>
  <link rel="icon" href="/assets/favicon.svg">
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1><span class="g">Git</span> 常用命令速查表</h1>
      <span class="ver">Cheat Sheet · CN</span>
    </div>
    <p class="subtitle">开发中最常用的 Git 命令集合，<b>点击任意命令即可复制</b>，上方搜索框可按命令或用途快速查询。</p>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="搜索命令或用途，例如 push、撤消、分支…" autocomplete="off" spellcheck="false">
      <span class="kbd"><kbd>/</kbd> 聚焦 · <kbd>Esc</kbd> 清空</span>
    </div>
    <div id="count"></div>
  </div>

  <section class="legend" id="legend"></section>
  <main class="grid" id="grid"></main>
  <div class="empty" id="empty">没有匹配的命令，换个关键词试试～</div>

  <footer>
    # Git Cheat Sheet &lt;CN&gt; · 整理自 Git 常用命令速查表 · 点击命令即可复制
  </footer>
</div>

<div id="toast"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><span>已复制到剪贴板</span></div>

<script>
const LEGEND=[
  ["master","默认开发分支"],
  ["origin","默认远程版本库"],
  ["Head","当前所在提交"],
  ["Head^","Head 的父提交"],
];
const DATA=[
  {name:"创建版本库",items:[
    ["git clone <url>","克隆远程版本库"],
    ["git init","初始化本地版本库"],
  ]},
  {name:"修改和提交",items:[
    ["git status","查看状态"],
    ["git diff","查看变更内容"],
    ["git add .","跟踪所有改动过的文件"],
    ["git add <file>","跟踪指定的文件"],
    ["git mv <old> <new>","文件改名"],
    ["git rm <file>","删除文件"],
    ["git rm --cached <file>","停止跟踪文件但不删除"],
    ["git commit -m \"commit message\"","提交所有更新过的文件"],
    ["git commit --amend","修改最后一次提交"],
  ]},
  {name:"查看提交历史",items:[
    ["git log","查看提交历史"],
    ["git log -p <file>","查看指定文件的提交历史"],
    ["git blame <file>","以列表方式查看指定文件的提交历史"],
  ]},
  {name:"撤消",items:[
    ["git reset --hard HEAD","撤消工作目录中所有未提交文件的修改内容"],
    ["git checkout HEAD <file>","撤消指定的未提交文件的修改内容"],
    ["git revert <commit>","撤消指定的提交"],
  ]},
  {name:"分支与标签",items:[
    ["git branch","显示所有本地分支"],
    ["git checkout <branch/tag>","切换到指定分支或标签"],
    ["git branch <new-branch>","创建新分支"],
    ["git branch -d <branch>","删除本地分支"],
    ["git tag","列出所有本地标签"],
    ["git tag <tagname>","基于最新提交创建标签"],
    ["git tag -d <tagname>","删除标签"],
  ]},
  {name:"合并与衍合",items:[
    ["git merge <branch>","合并指定分支到当前分支"],
    ["git rebase <branch>","衍合指定分支到当前分支"],
  ]},
  {name:"远程操作",items:[
    ["git remote -v","查看远程版本库信息"],
    ["git remote show <remote>","查看指定远程版本库信息"],
    ["git remote add <remote> <url>","添加远程版本库"],
    ["git fetch <remote>","从远程库获取代码"],
    ["git pull <remote> <branch>","下载代码及快速合并"],
    ["git push <remote> <branch>","上传代码及快速合并"],
    ["git push <remote> :<branch/tag-name>","删除远程分支或标签"],
    ["git push --tags","上传所有标签"],
  ]},
];
</script>
<script src="app.js"></script>
</body>
</html>
