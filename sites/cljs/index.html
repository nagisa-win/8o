<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClojureScript 自学站 · cljs.8o.nz</title>
    <meta name="description" content="分章节的 ClojureScript 中文教程，每一段代码都能在页面里直接运行。基于 SCI 解释器，纯前端。" />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" href="https://8o.nz/assets/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://cljs.8o.nz/" />
    <link rel="stylesheet" href="/ui/8o.css" />
    <link rel="stylesheet" href="assets/cljs.css" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("8o-theme") === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar__inner">
        <a class="brand mono" href="https://8o.nz/"><span>8o</span> / CLJS</a>
        <span class="label">CLOJURESCRIPT · IN-BROWSER</span>
        <div class="topbar__right">
          <button class="theme-btn" type="button" data-theme-toggle aria-label="切换主题">
            <svg class="theme-btn__sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
            </svg>
            <svg class="theme-btn__moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12.8A8.5 8.5 0 1111.2 3a6.5 6.5 0 009.8 9.8z" />
            </svg>
          </button>
          <a class="back mono" href="https://lab.8o.nz/">实验室 ↗</a>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="章节目录">
        <p class="label">章节目录</p>
        <ol id="chapters"></ol>
        <p class="sidebar__note">代码直接在浏览器里解释执行，不会上传任何内容。</p>
      </aside>

      <section class="content" id="content" aria-live="polite"></section>

      <aside class="console" aria-label="Playground">
        <div class="console__head">
          <span class="label">PLAYGROUND</span>
          <button class="btn-sm" id="run" type="button">运行 ⌘↵</button>
        </div>
        <textarea id="code" spellcheck="false" aria-label="ClojureScript 代码">(map inc [1 2 3])</textarea>
        <div class="console__out" id="out">点「运行」执行上面的代码。</div>
        <div class="console__foot mono" id="status">SCI 解释器 · 本地执行</div>
      </aside>
    </main>

    <script src="/vendor/scittle.js"></script>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
